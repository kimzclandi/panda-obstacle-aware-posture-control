name: Documentation navigation
on:
  push:
    paths: ['README*.md', 'docs/reproduction.md', '.github/scripts/check_readmes.py', '.github/workflows/documentation.yml']
  pull_request:
    paths: ['README*.md', 'docs/reproduction.md', '.github/scripts/check_readmes.py', '.github/workflows/documentation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/check_readmes.py
